<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coach-as-Code</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b1b1f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plan Marathon">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
  /* ====== Tokens ====== */
  :root{
    --bg:#f0f0f3;
    --surface:#ffffff;
    --ink:#1b1b1f;
    --muted:#6b6b76;
    --lime:#e9ff5a;
    --lime-ink:#4c5410;
    --blue-bg:#dfe6ff;
    --blue-ink:#3b4a86;
    --line:#e7e7ec;

    --ef:#4eb876;
    --seuil:#f0b429;
    --frac:#e2637a;
    --am:#f2994a;
    --rest-ink:#8b8b95;

    --pill-frac-bg:#ffe3ea;   --pill-frac-ink:#c2415c;
    --pill-am-bg:#ffeed8;     --pill-am-ink:#b5701f;
    --pill-sl-bg:#e2f4e8;     --pill-sl-ink:#2f7d4e;
    --pill-ef-bg:#eef0f4;     --pill-ef-ink:#5a6270;
    --pill-seuil-bg:#fdf1d6;  --pill-seuil-ink:#b07d0a;
    --pill-rest-bg:#f0f0f3;   --pill-rest-ink:#8b8b95;
    --pill-warn-bg:#fdf1d6;   --pill-warn-ink:#b07d0a;

    --status-done-bg:#e8fbf0; --status-done:#2ecc71; --status-done-txt:#1e9e5c;
    --status-todo-bg:#eaf4fd; --status-todo:#4a9de8; --status-todo-txt:#2f7fc4;
    --status-warn-bg:#fdf1d6; --status-warn:#f0b429; --status-warn-txt:#b07d0a;
    --status-neutral-bg:#f0f0f3; --status-neutral:#b3b3ba; --status-neutral-txt:#8b8b95;

    --r-bento:24px; --r-card:20px; --r-badge:15px; --r-pill:99px;
    --gutter:10px;
  }
  *{box-sizing:border-box;}
  html{background:var(--bg);}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:"Bricolage Grotesque",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    font-weight:400;
    padding:16px 16px 100px;
  }
  .page{max-width:430px;margin:0 auto;}
  h1,h2{margin:0;}
  button{font-family:inherit;}
  .ico{width:22px;height:22px;flex-shrink:0;}
  .ico-sm{width:14px;height:14px;stroke-width:2;}
  .ico-nav{width:19px;height:19px;}

  @media (prefers-reduced-motion: reduce){
    *{transition-duration:.001ms !important; animation-duration:.001ms !important; scroll-behavior:auto !important;}
  }

  /* ====== 1. Header ====== */
  .app-header{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 14px;}
  .app-title{font-size:19px;font-weight:800;letter-spacing:-0.02em;}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;}

  /* ====== Layout bento (grid + sections) ====== */
  .bento{border-radius:var(--r-bento);padding:20px;}
  section{margin-bottom:var(--gutter);}
  .section-title{font-size:15.5px;font-weight:800;letter-spacing:-0.01em;margin:18px 2px 10px;}
  .section-title-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 2px 10px;}
  .section-title-row .section-title{margin:0;}
  .toggle-link{border:none;background:none;color:var(--muted);font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;padding:8px 2px;min-height:44px;}
  .toggle-link:hover{color:var(--ink);}

  /* ====== 2. Hero countdown ====== */
  .hero{background:var(--ink);color:#fff;}
  .hero-label{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:#c8c8d0;}
  .hero-label .ico{color:#c8c8d0;}
  .hero-count{font-size:72px;font-weight:800;letter-spacing:-0.02em;line-height:1;margin:10px 0 4px;}
  .hero-count small{font-size:22px;font-weight:700;letter-spacing:0;margin-left:6px;color:#c8c8d0;}
  .hero-bar{height:8px;border-radius:var(--r-pill);background:rgba(255,255,255,.14);overflow:hidden;margin:14px 0 10px;}
  .hero-bar-fill{height:100%;background:var(--lime);border-radius:var(--r-pill);width:0%;transition:width .4s ease;}
  .hero-foot{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:600;color:#c8c8d0;}

  /* ====== 3. Stats row ====== */
  .stats-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--gutter);}
  .stat{border-radius:var(--r-bento);padding:18px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;}
  .stat-lime{background:var(--lime);color:var(--lime-ink);}
  .stat-lime .ico{color:var(--lime-ink);}
  .stat-white{background:var(--surface);color:var(--ink);}
  .stat-white .ico{color:var(--ink);}
  .stat-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;margin-top:10px;}
  .stat-value{font-size:34px;font-weight:800;letter-spacing:-0.02em;line-height:1.05;margin-top:2px;
    white-space:nowrap;overflow-wrap:normal;}
  .stat-value .stat-unit{font-size:15px;font-weight:700;}
  /* le cumul dépasse 3 chiffres + décimale : on rétrécit pour rester sur une ligne */
  @media (max-width:420px){ .stat-value{font-size:29px;} .stat-value .stat-unit{font-size:13px;} }
  .stat-sub{font-size:12px;font-weight:600;opacity:.75;margin-top:2px;}

  /* ====== 4. Séance du jour ====== */
  .today-card{background:var(--blue-bg);color:var(--blue-ink);}
  .today-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
  .today-date{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;opacity:.8;}
  .today-badge{font-size:11px;font-weight:800;padding:4px 11px;border-radius:var(--r-pill);background:rgba(59,74,134,.12);white-space:nowrap;}
  .today-badge.done{background:var(--status-done-bg);color:var(--status-done-txt);}
  .today-title-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .today-title-row .ico{width:24px;height:24px;}
  .today-title{font-size:20px;font-weight:800;letter-spacing:-0.02em;}
  .today-pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
  .today-pill{background:#fff;color:var(--blue-ink);border-radius:var(--r-pill);padding:7px 13px;font-size:12.5px;font-weight:700;display:flex;gap:5px;align-items:baseline;}
  .today-pill span{font-weight:600;opacity:.85;font-size:11px;}
  .today-cta{width:100%;background:var(--ink);color:#fff;border:none;border-radius:var(--r-pill);padding:14px 18px;font-size:14.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;min-height:48px;}
  .today-cta:hover{opacity:.92;}
  .today-note{font-size:12.5px;font-weight:600;line-height:1.5;opacity:.85;}

  /* ====== 5. Liste séances semaine courante (cartes) ====== */
  .scard{background:var(--surface);border-radius:var(--r-card);padding:16px;display:flex;align-items:center;gap:13px;margin-bottom:var(--gutter);}
  .scard.deviant{border:1.5px solid var(--seuil);}
  .scard-badge{width:46px;height:46px;border-radius:var(--r-badge);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .scard-badge .ico{width:22px;height:22px;}
  .scard-body{min-width:0;flex:1;}
  .scard-date{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:2px;}
  .scard-title{font-size:15px;font-weight:700;letter-spacing:-0.01em;line-height:1.25;overflow-wrap:break-word;}
  .scard-bar{display:flex;width:100%;height:5px;border-radius:var(--r-pill);overflow:hidden;background:#eee;margin-top:8px;}
  .scard-bar .mseg{height:100%;}
  .scard-note{display:flex;align-items:flex-start;gap:5px;font-size:11.5px;font-weight:600;color:#8a5c06;margin-top:8px;line-height:1.4;}
  .scard-note .ico-sm{margin-top:2px;color:#8a5c06;}
  .scard-right{text-align:right;flex-shrink:0;padding-left:4px;}
  .scard-dist{font-size:15px;font-weight:800;white-space:nowrap;}
  .scard-dist small{font-size:11px;font-weight:700;color:var(--muted);}
  .scard-status{font-size:10.5px;font-weight:700;color:var(--muted);margin-top:3px;white-space:nowrap;}
  .scard-rest{color:var(--muted);font-style:normal;}

  /* icon pastille tints by zone */
  .tint-frac{background:var(--pill-frac-bg);color:var(--pill-frac-ink);}
  .tint-am{background:var(--pill-am-bg);color:var(--pill-am-ink);}
  .tint-sl{background:var(--pill-sl-bg);color:var(--pill-sl-ink);}
  .tint-ef{background:var(--pill-ef-bg);color:var(--pill-ef-ink);}
  .tint-seuil{background:var(--pill-seuil-bg);color:var(--pill-seuil-ink);}
  .tint-rest{background:var(--pill-rest-bg);color:var(--pill-rest-ink);}

  /* ====== 6. Bottom nav ====== */
  .bottom-nav{position:fixed;left:16px;right:16px;bottom:14px;max-width:398px;margin:0 auto;background:var(--surface);border-radius:var(--r-pill);padding:6px;display:flex;gap:4px;box-shadow:0 6px 24px rgba(27,27,31,.14);z-index:20;}
  .nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:none;border-radius:var(--r-pill);padding:8px 4px;min-height:48px;cursor:pointer;color:var(--muted);font-size:10.5px;font-weight:700;}
  .nav-tab .ico-nav{color:var(--muted);}
  .nav-tab[aria-current="page"]{background:var(--ink);color:#fff;}
  .nav-tab[aria-current="page"] .ico-nav{color:#fff;}

  /* ====== 7. Accordéon (plan complet) ====== */
  .week{background:var(--surface);border-radius:var(--r-card);margin-bottom:var(--gutter);overflow:hidden;}
  .week-head{display:flex;width:100%;align-items:center;justify-content:space-between;padding:16px 18px;cursor:pointer;user-select:none;gap:12px;border:none;background:none;text-align:left;color:inherit;min-height:44px;}
  .week-head:hover{background:#fafafc;}
  .wh-left{display:flex;align-items:center;gap:12px;min-width:0;}
  .wh-num{font-size:11px;font-weight:800;color:var(--muted);width:34px;flex-shrink:0;text-transform:uppercase;letter-spacing:.06em;}
  .wh-mid{min-width:0;}
  .wh-title{font-weight:700;font-size:14px;letter-spacing:-0.01em;overflow:hidden;text-overflow:ellipsis;display:block;}
  .wh-vol{font-size:11.5px;color:var(--muted);font-weight:600;}
  .wh-dates{font-size:10.5px;line-height:1.35;color:var(--muted);font-weight:600;display:block;}
  .meteo{font-size:12.5px;white-space:nowrap;color:var(--ink);}
  .meteo.past{color:var(--muted);}
  .wh-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .wsdot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .wsdot.done{background:var(--status-done);}
  .wsdot.warn{background:var(--status-warn);}
  .wsdot.danger{background:var(--frac);}
  .wsdot.neutral{background:var(--status-neutral);}
  .week-comment{font-size:12.5px;line-height:1.55;color:var(--ink);border-left:3px solid var(--ef);padding:2px 0 2px 11px;margin:0 18px 14px;font-weight:600;}
  .week-comment.warn{border-left-color:var(--status-warn);}
  .week-comment.danger{border-left-color:var(--frac);}
  .week-comment.neutral{border-left-color:var(--status-neutral);}
  .chevron{transition:transform .18s ease;flex-shrink:0;color:var(--muted);}
  .week.open > .week-head .chevron{transform:rotate(180deg);}
  .week-body{max-height:0;overflow:hidden;transition:max-height .3s ease;}
  .week.open > .week-body{max-height:9000px;}

  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table{width:100%;border-collapse:collapse;}
  tbody tr.row{cursor:pointer;border-bottom:1px solid var(--line);transition:background .15s ease;}
  tbody tr.row:hover{background:#fafafc;}
  .icon-cell{display:flex;align-items:center;gap:10px;}
  .row-badge{width:32px;height:32px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .row-badge .ico{width:16px;height:16px;}
  .name-block .day{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:1px;font-weight:700;}
  .name-block .name{font-weight:700;font-size:13.5px;}
  .status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px 3px 7px;border-radius:var(--r-pill);white-space:nowrap;}
  .status .dot{width:6px;height:6px;border-radius:50%;}
  .status.done{color:var(--status-done-txt);background:var(--status-done-bg);} .status.done .dot{background:var(--status-done);}
  .status.todo{color:var(--status-todo-txt);background:var(--status-todo-bg);} .status.todo .dot{background:var(--status-todo);}
  .status.warn{color:var(--status-warn-txt);background:var(--status-warn-bg);} .status.warn .dot{background:var(--status-warn);}
  .status.neutral{color:var(--status-neutral-txt);background:var(--status-neutral-bg);} .status.neutral .dot{background:var(--status-neutral);}
  .distance{font-weight:800;}
  .mini-bar{display:flex;width:100%;min-width:100px;height:6px;border-radius:var(--r-pill);overflow:hidden;background:#eee;}
  .mini-bar .mseg{height:100%;}
  .chev-cell{color:var(--muted);display:inline-flex;transition:transform .18s ease;}
  tr.row.open .chev-cell{transform:rotate(180deg);}
  .detail-row td{padding:0;border-bottom:1px solid var(--line);}
  .detail-wrap{max-height:0;overflow:hidden;transition:max-height .28s ease;background:#fafafc;}
  .detail-row.open .detail-wrap{max-height:1600px;}
  .detail-inner{padding:14px 14px 18px;}
  /* Barre de structure : toujours 100% de la largeur, jamais de scroll horizontal.
     Le détail de chaque segment est lu dans .seg-list juste en dessous. */
  .full-bar{display:flex;width:100%;height:26px;border-radius:8px;overflow:hidden;margin-bottom:10px;}
  .full-bar .seg{min-width:2px;}
  .seg-list{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:5px;}
  .seg-list li{display:grid;grid-template-columns:8px 1fr auto;align-items:baseline;gap:8px;font-size:12px;}
  .seg-dot{width:8px;height:8px;border-radius:3px;align-self:center;}
  .seg-name{font-weight:700;color:var(--ink);min-width:0;line-height:1.3;overflow-wrap:break-word;}
  .seg-meta{font-family:ui-monospace,"Courier New",monospace;font-size:11px;color:var(--muted);font-weight:600;text-align:right;white-space:nowrap;}
  .metrics-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .chip{background:var(--bg);border-radius:var(--r-pill);padding:4px 10px;font-size:11.5px;font-weight:600;display:flex;gap:5px;align-items:baseline;}
  .chip b{font-family:ui-monospace,"Courier New",monospace;font-size:12px;} .chip span{color:var(--muted);font-size:10px;}
  .comment{font-size:12.5px;line-height:1.55;color:var(--ink);border-left:3px solid var(--ef);padding:2px 0 2px 11px;font-weight:600;}
  .comment.warn{border-left-color:var(--frac);}
  .rest-row td{color:var(--muted);font-size:13px;font-weight:600;font-style:normal;}
  footer{margin-top:20px;font-size:11.5px;color:var(--muted);text-align:center;font-weight:600;}

  /* ====== Séances en pile de cartes (toutes tailles d'écran) ======
     Référence iPhone 15 (393px). Le tableau à 6 colonnes ne tient ni sur mobile ni
     dans la grille desktop (une carte de semaine y fait au plus ~430px), donc chaque
     séance est disposée en grille : nom + distance, statut + météo, mini-barre.
     Résultat : plus aucun défilement horizontal, semaine ou séance dépliée. ====== */
  .table-scroll{overflow-x:visible;}
  table, tbody{display:block;width:100%;}
  thead{display:none;}
  tbody tr.row{display:grid;grid-template-columns:1fr auto 16px;column-gap:8px;row-gap:7px;
    align-items:center;padding:11px 14px;}
  tbody tr.row > td{display:block;padding:0;border:none;font-size:12.5px;}
  tr.row > td:nth-child(1){grid-column:1;grid-row:1;min-width:0;}        /* icône + nom */
  tr.row > td:nth-child(3){grid-column:2;grid-row:1;text-align:right;}   /* distance */
  tr.row > td:nth-child(6){grid-column:3;grid-row:1;text-align:right;}   /* chevron */
  tr.row > td:nth-child(2){grid-column:1;grid-row:2;}                    /* statut */
  tr.row > td:nth-child(4){grid-column:2/4;grid-row:2;text-align:right;} /* météo */
  tr.row > td:nth-child(5){grid-column:1/-1;grid-row:3;}                 /* mini-barre */
  tr.row.open > td:nth-child(5){display:none;}   /* doublon avec la barre du détail */
  tr.detail-row{display:block;}
  tr.detail-row > td{display:block;padding:0;}
  .rest-row{display:block;}
  .rest-row td{display:block;padding:10px 14px;font-size:12px;}
  .icon-cell{gap:9px;}
  .row-badge{width:30px;height:30px;}
  .name-block .name{font-size:13px;line-height:1.25;}
  .name-block .day{font-size:9.5px;}
  .status{font-size:11px;padding:3px 8px 3px 6px;}
  .distance{font-size:14px;white-space:nowrap;}
  .meteo{font-size:11px;white-space:normal;}
  .week-comment{font-size:12px;margin:0 14px 12px;}
  .comment{font-size:12px;}
  .chip{font-size:11px;padding:3px 9px;}

  /* ====== Responsive ≥640px ====== */
  @media (min-width:640px){
    .page{max-width:1100px;}
    .stats-row{grid-template-columns:repeat(3,1fr);}
    .stat-white{grid-column:span 2;}
    #weekSessionsList, #weeks{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--gutter);align-content:start;}
    #weekSessionsList .scard, #weeks .week{margin-bottom:0;}
  }
  @media (min-width:900px){
    #weekSessionsList, #weeks{grid-template-columns:repeat(3,1fr);}
  }
</style>
</head>

function seg(label,min,pace,color){return {label,min:Math.round(min),pace,color};}
function segR(label,minLo,minHi,pace,color){return {label,min:Math.round((minLo+minHi)/2),range:`${minLo}-${minHi} min`,pace,color};}
function s(day,name,icon,iconClass,status,statusLabel,distance,segments,metrics,comment,warn,meteo){
  return {day,name,icon,iconClass,status,statusLabel,distance,segments,metrics,comment,warn:!!warn,meteo};
}
function rest(day,label,note){ return {rest:true, day, label, note}; }
function repBlock(reps,workLabel,workMin,workPace,workColor,recovMin,recovColor){
  const segs = [];
  const wBase = Math.floor(workMin/reps), wRem = workMin - wBase*reps;
  const rBase = Math.floor(recovMin/reps), rRem = recovMin - rBase*reps;
  for(let i=0;i<reps;i++){
    segs.push(seg(workLabel, wBase + (i<wRem?1:0), workPace, workColor));
    segs.push(seg("Récup", rBase + (i<rRem?1:0), "trot", recovColor));
  }
  return segs;
}
function repBlockR(reps,workLabel,workMinLo,workMinHi,workPace,workColor,recovMin,recovColor){
  const segs = [];
  const wLo = Math.max(1, Math.round(workMinLo/reps));
  const wHi = Math.max(wLo, Math.round(workMinHi/reps));
  const rBase = Math.floor(recovMin/reps), rRem = recovMin - rBase*reps;
  for(let i=0;i<reps;i++){
    segs.push(segR(workLabel, wLo, wHi, workPace, workColor));
    segs.push(seg("Récup", rBase + (i<rRem?1:0), "trot", recovColor));
  }
  return segs;
}

/* ============================================================
   Bento render layer — reads the `weeks` data above, never
   mutates it. Icons via the Lucide sprite defined in <body>.
   ============================================================ */

const RACE_DATE = new Date('2026-10-04T00:00:00');
const sessionRowMap = new Map(); // sess object -> {weekEl,row,detailRow}, for CTA/card deep-links

function iconSvg(name, extraCls){
  return `<svg class="ico ${extraCls||''}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
}

function miniBarHTML(segments){
  return (segments||[]).map(sg => `<div class="mseg" style="flex:${sg.min};background:${sg.color};"></div>`).join('');
}

/* Regroupe les segments identiques (les répétitions d'un fractionné) pour que la liste
   de détail tienne en quelques lignes : "5× 1,6 km" au lieu de cinq lignes séparées. */
function groupSegments(segments){
  const out = [], seen = new Map();
  (segments||[]).forEach(sg => {
    const key = [sg.label, sg.pace, sg.color].join('|');
    if (seen.has(key)) {
      const g = out[seen.get(key)];
      g.count++; g.mins.push(sg.min);
      if (g.range !== sg.range) g.range = null;   // durées annoncées différentes
    } else {
      seen.set(key, out.length);
      out.push({ sg, count: 1, mins: [sg.min], range: sg.range });
    }
  });
  return out.map(g => {
    const lo = Math.min(...g.mins), hi = Math.max(...g.mins);
    // les répétitions d'un même bloc peuvent différer d'une minute (reste de division) :
    // on les regroupe quand même et on affiche la fourchette.
    return { sg: g.sg, count: g.count, time: g.range || (lo === hi ? lo + ' min' : lo + '-' + hi + ' min') };
  });
}

function sessionTypeMeta(sess){
  const labels = (sess.segments||[]).map(sg => sg.label);
  const hasSeuilLabel = labels.some(l => /^Seuil/.test(l));
  const hasRecup = labels.includes('Récup');
  const hasAM = labels.some(l => /^(Allure marathon|AM bloc|Course)/.test(l));
  if (hasAM) return {icon:'activity', tint:'am'};
  if (sess.iconClass === 'seuil') {
    if (hasSeuilLabel) return {icon:'gauge', tint:'seuil'};
    if (hasRecup) return {icon:'zap', tint:'frac'};
    return {icon:'gauge', tint:'seuil'};
  }
  if (sess.iconClass === 'sl') return {icon:'mountain', tint:'sl'};
  return {icon:'footprints', tint:'ef'}; // 'ef' and 'cross' (Via Ferrata) fall back here
}

function parseDistanceKm(distance){
  const str = String(distance || '');
  if (!/km/i.test(str)) return 0;
  const m = str.replace(',', '.').match(/[\d.]+/);
  return m ? parseFloat(m[0]) || 0 : 0;
}

function splitDistance(distance){
  if (!distance || distance === '—') return ['—', ''];
  const m = String(distance).match(/^([\d.,]+)\s*(.*)$/);
  return m ? [m[1], m[2]] : [distance, ''];
}

function sessionDurationMin(sess){
  return (sess.segments||[]).reduce((total, sg) => total + sg.min, 0);
}

function formatDuration(totalMin){
  const h = Math.floor(totalMin / 60), m = Math.round(totalMin % 60);
  return h > 0 ? `${h}h${String(m).padStart(2,'0')}` : `${m} min`;
}

function pickWorkPace(sess){
  const workColors = [FRACC, SEUILY, T];
  const workSeg = (sess.segments||[]).find(sg => workColors.includes(sg.color));
  if (workSeg) return workSeg.pace;
  const efSeg = (sess.segments||[]).find(sg => sg.color === EFG);
  if (efSeg) return efSeg.pace;
  return sess.segments && sess.segments[0] ? sess.segments[0].pace : '—';
}

function findNutritionPill(sess){
  return (sess.metrics||[]).find(m => /glucide/i.test(m.lbl));
}

function isSessionDone(sess){
  return sess.status === 'done' || (sess.status === 'warn' && sess.statusLabel !== 'Non réalisée');
}

function extractSessionDate(dayStr){
  const m = String(dayStr).match(/(\d{1,2})\/(\d{1,2})/);
  if (!m) return null;
  return new Date(2026, parseInt(m[2],10) - 1, parseInt(m[1],10));
}

function todayMidnight(){
  const d = new Date();
  d.setHours(0,0,0,0);
  return d;
}

const numberedWeeks = weeks.filter(w => /^S\d+$/.test(w.num));

function getCurrentWeek(){
  const today = todayMidnight();
  let idx = 0;
  weeks.forEach((w, i) => { if (new Date(w.start) <= today) idx = i; });
  return weeks[idx];
}

function getNumberedProgress(){
  const today = todayMidnight();
  let idx = 0;
  numberedWeeks.forEach((w, i) => { if (new Date(w.start) <= today) idx = i; });
  return { current: idx + 1, total: numberedWeeks.length };
}

function getTodayItem(){
  const today = todayMidnight();
  const cw = getCurrentWeek();
  for (const sess of cw.sessions) {
    const d = extractSessionDate(sess.day);
    if (d && d.getTime() === today.getTime()) return { sess, week: cw };
  }
  for (const w of weeks) {
    for (const sess of w.sessions) {
      if (!sess.rest && sess.status === 'todo') return { sess, week: w, fallback: true };
    }
  }
  return null;
}

function computeCumulKm(){
  let total = 0;
  weeks.forEach(w => {
    w.sessions.forEach(sess => {
      if (!sess.rest && isSessionDone(sess)) total += parseDistanceKm(sess.distance);
    });
  });
  return total;
}

function scrollToWeekSession(sess){
  const rec = sessionRowMap.get(sess);
  if (!rec) return;
  rec.weekEl.classList.add('open');
  rec.weekEl.querySelector('.week-head').setAttribute('aria-expanded', 'true');
  rec.row.classList.add('open');
  rec.detailRow.classList.add('open');
  rec.row.scrollIntoView({ behavior: prefersReducedMotion ? 'auto' : 'smooth', block: 'center' });
}

/* ---- 7. Accordéon plan complet (bâti en premier pour peupler sessionRowMap) ---- */

const container = document.getElementById('weeks');
const allWeekEls = [];

weeks.forEach((w) => {
  const weekEl = document.createElement('div');
  weekEl.className = 'week';

  const volLine = w.volReal ? `${w.vol} · <b>${w.volReal}</b>` : w.vol;
  const statusCls = w.statusEmoji==='🟢'?'done':w.statusEmoji==='🟡'?'warn':w.statusEmoji==='🔴'?'danger':'neutral';

  weekEl.innerHTML = `
    <button class="week-head" type="button" aria-expanded="false">
      <div class="wh-left">
        <span class="wh-num">${w.num}</span>
        <div class="wh-mid">
          <span class="wh-title">${w.title}</span>
          <span class="wh-dates">${w.dates} · ${volLine}</span>
        </div>
      </div>
      <div class="wh-right">
        <span class="wsdot ${statusCls}" title="${w.statusText}"></span>
        ${iconSvg('chevron-down', 'ico-nav chevron')}
      </div>
    </button>
    <div class="week-body">
      <div class="week-comment ${statusCls}">${w.statusEmoji} ${w.statusText}</div>
      <div class="table-scroll">
        <table>
          <thead><tr><th>Séance</th><th>Statut</th><th>Distance</th><th>Météo</th><th>Répartition</th><th></th></tr></thead>
          <tbody class="wtbody"></tbody>
        </table>
      </div>
    </div>
  `;

  const head = weekEl.querySelector('.week-head');
  head.addEventListener('click', () => {
    const nowOpen = weekEl.classList.toggle('open');
    head.setAttribute('aria-expanded', String(nowOpen));
  });

  const tbody = weekEl.querySelector('.wtbody');

  w.sessions.forEach((sess) => {
    if (sess.rest) {
      const tr = document.createElement('tr');
      tr.className = 'rest-row';
      tr.innerHTML = `<td colspan="6">${sess.day} — ${sess.label}${sess.note ? ' · ' + sess.note : ''}</td>`;
      tbody.appendChild(tr);
      return;
    }

    const meta = sessionTypeMeta(sess);
    const row = document.createElement('tr');
    row.className = 'row';
    row.tabIndex = 0;
    row.setAttribute('role', 'button');
    row.innerHTML = `
      <td><div class="icon-cell"><div class="row-badge tint-${meta.tint}">${iconSvg(meta.icon)}</div>
        <div class="name-block"><div class="day">${sess.day}</div><div class="name">${sess.name}</div></div></div></td>
      <td><span class="status ${sess.status}"><span class="dot"></span>${sess.statusLabel}</span></td>
      <td><span class="distance">${sess.distance}</span></td>
      <td><span class="meteo ${sess.status==='done'?'past':''}">${sess.meteo||'—'}</span></td>
      <td><div class="mini-bar">${miniBarHTML(sess.segments)}</div></td>
      <td style="text-align:right;"><span class="chev-cell">${iconSvg('chevron-down', 'ico-sm')}</span></td>
    `;

    const detailRow = document.createElement('tr');
    detailRow.className = 'detail-row';
    detailRow.innerHTML = `
      <td colspan="6"><div class="detail-wrap"><div class="detail-inner">
        <div class="full-bar" aria-hidden="true">${sess.segments.map(sg => `
          <div class="seg" style="flex:${sg.min} 1 0;background:${sg.color};"></div>`).join('')}</div>
        <ul class="seg-list">${groupSegments(sess.segments).map(g => `
          <li><span class="seg-dot" style="background:${g.sg.color}"></span>
            <span class="seg-name">${g.count > 1 ? g.count + '× ' : ''}${g.sg.label}</span>
            <span class="seg-meta">${g.time} · ${g.sg.pace}</span></li>`).join('')}</ul>
        <div class="metrics-row">${sess.metrics.map(m => `<div class="chip"><b>${m.val}</b><span>${m.lbl}</span></div>`).join('')}</div>
        <div class="comment ${sess.warn ? 'warn' : ''}">${sess.comment}</div>
      </div></div></td>
    `;

    const toggleRow = () => {
      const isOpen = row.classList.contains('open');
      row.classList.toggle('open', !isOpen);
      detailRow.classList.toggle('open', !isOpen);
    };
    row.addEventListener('click', toggleRow);
    row.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleRow(); } });

    tbody.appendChild(row);
    tbody.appendChild(detailRow);
    sessionRowMap.set(sess, { weekEl, row, detailRow });
  });

  container.appendChild(weekEl);
  allWeekEls.push(weekEl);
});

/* ---- Tout déplier / Tout réduire (fonctionnalité existante, relocalisée) ---- */

const toggleAllBtn = document.getElementById('toggleAllBtn');
toggleAllBtn.addEventListener('click', () => {
  const expand = toggleAllBtn.textContent.trim() === 'Tout déplier';
  allWeekEls.forEach(w => {
    w.classList.toggle('open', expand);
    w.querySelector('.week-head').setAttribute('aria-expanded', String(expand));
  });
  toggleAllBtn.textContent = expand ? 'Tout réduire' : 'Tout déplier';
});

/* ---- 2-3. Hero compte à rebours + stats ---- */

function renderHero(){
  const today = todayMidnight();
  const msPerDay = 86400000;
  const daysLeft = Math.max(0, Math.ceil((RACE_DATE - today) / msPerDay));
  document.getElementById('heroDays').textContent = daysLeft;

  const planStart = new Date(weeks[0].start);
  const pct = Math.max(0, Math.min(100, Math.round(((today - planStart) / (RACE_DATE - planStart)) * 100)));
  document.getElementById('heroBarFill').style.width = pct + '%';
  document.getElementById('heroPct').textContent = pct + '% du plan';

  const prog = getNumberedProgress();
  document.getElementById('heroWeek').textContent = `Semaine ${prog.current} / ${prog.total}`;

  document.getElementById('statCumul').textContent = computeCumulKm().toFixed(1).replace('.', ',') + ' km';
}

/* ---- 4. Séance du jour ---- */

function renderToday(){
  const el = document.getElementById('todayCard');
  const item = getTodayItem();

  if (!item) {
    el.innerHTML = `<div class="today-note">Aucune séance à venir dans le plan.</div>`;
    return;
  }

  const { sess } = item;

  if (sess.rest) {
    el.innerHTML = `
      <div class="today-top">
        <span class="today-date">${sess.day}</span>
        <span class="today-badge">REPOS</span>
      </div>
      <div class="today-title-row">${iconSvg('moon')}<span class="today-title">${sess.label}</span></div>
      ${sess.note ? `<div class="today-note">${sess.note}</div>` : ''}
    `;
    return;
  }

  const meta = sessionTypeMeta(sess);
  const done = isSessionDone(sess);
  const durMin = sessionDurationMin(sess);
  const pace = pickWorkPace(sess);
  const nutri = findNutritionPill(sess);

  const pills = [];
  if (durMin) pills.push(`<div class="today-pill"><b>${formatDuration(durMin)}</b><span>durée</span></div>`);
  if (pace && pace !== '—') pills.push(`<div class="today-pill"><b>${pace}</b><span>allure</span></div>`);
  if (nutri) pills.push(`<div class="today-pill"><b>${nutri.val}</b><span>${nutri.lbl}</span></div>`);

  el.innerHTML = `
    <div class="today-top">
      <span class="today-date">${sess.day}</span>
      <span class="today-badge ${done ? 'done' : ''}">${done ? 'FAIT' : 'À VENIR'}</span>
    </div>
    <div class="today-title-row">${iconSvg(meta.icon)}<span class="today-title">${sess.name}</span></div>
    <div class="today-pills">${pills.join('')}</div>
    <button class="today-cta" type="button" id="todayCtaBtn">Voir le détail de la séance ${iconSvg('arrow-right', 'ico-sm')}</button>
  `;

  document.getElementById('todayCtaBtn').addEventListener('click', () => scrollToWeekSession(sess));
}

/* ---- 5. Liste des séances de la semaine courante ---- */

function renderWeekSessionsList(){
  const cw = getCurrentWeek();
  const wrap = document.getElementById('weekSessionsList');
  wrap.innerHTML = '';

  cw.sessions.forEach((sess) => {
    const card = document.createElement('div');

    if (sess.rest) {
      card.className = 'scard';
      card.innerHTML = `
        <div class="scard-badge tint-rest">${iconSvg('moon')}</div>
        <div class="scard-body">
          <div class="scard-date">${sess.day}</div>
          <div class="scard-title scard-rest">${sess.label}${sess.note ? ' · ' + sess.note : ''}</div>
        </div>
      `;
      wrap.appendChild(card);
      return;
    }

    const meta = sessionTypeMeta(sess);
    const deviant = sess.status === 'warn';
    const [distNum, distUnit] = splitDistance(sess.distance);

    card.className = 'scard' + (deviant ? ' deviant' : '');
    card.tabIndex = 0;
    card.setAttribute('role', 'button');
    card.innerHTML = `
      <div class="scard-badge tint-${meta.tint}">${iconSvg(meta.icon)}</div>
      <div class="scard-body">
        <div class="scard-date">${sess.day}</div>
        <div class="scard-title">${sess.name}</div>
        <div class="scard-bar">${miniBarHTML(sess.segments)}</div>
        ${deviant ? `<div class="scard-note">${iconSvg('triangle-alert', 'ico-sm')}<span>${sess.comment}</span></div>` : ''}
      </div>
      <div class="scard-right">
        <div class="scard-dist">${distNum}<small>${distUnit}</small></div>
        <div class="scard-status">${sess.statusLabel}</div>
      </div>
    `;
    const open = () => scrollToWeekSession(sess);
    card.addEventListener('click', open);
    card.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
    wrap.appendChild(card);
  });
}

/* ---- 6. Nav basse : scroll vers section + onglet actif ---- */

const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const navTabs = Array.from(document.querySelectorAll('.nav-tab'));

navTabs.forEach(tab => {
  tab.addEventListener('click', () => {
    const target = document.getElementById(tab.dataset.target);
    if (target) target.scrollIntoView({ behavior: prefersReducedMotion ? 'auto' : 'smooth', block: 'start' });
    setActiveTab(tab);   // retour visuel immédiat, sans attendre le scroll
  });
});

/* Onglet actif = dernière section passée sous la ligne des 40% de l'écran.
   Les sections sont triées par position réelle dans le document, qui ne suit pas
   l'ordre des onglets (stats est au-dessus de la semaine et du plan). */
const navSections = navTabs
  .map(tab => ({ tab, target: document.getElementById(tab.dataset.target) }))
  .filter(s => s.target)
  .sort((a, b) => a.target.offsetTop - b.target.offsetTop);

function setActiveTab(tab){
  navTabs.forEach(t => t.removeAttribute('aria-current'));
  tab.setAttribute('aria-current', 'page');
}

function updateActiveTab(){
  const line = window.innerHeight * 0.4;
  let current = navSections[0];
  navSections.forEach(s => { if (s.target.getBoundingClientRect().top <= line) current = s; });
  // arrivé en bas de page, la dernière section est forcément celle qu'on regarde
  if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) {
    current = navSections[navSections.length - 1];
  }
  if (current) setActiveTab(current.tab);
}

let navTicking = false;
window.addEventListener('scroll', () => {
  if (navTicking) return;
  navTicking = true;
  requestAnimationFrame(() => { updateActiveTab(); navTicking = false; });
}, { passive: true });
window.addEventListener('resize', updateActiveTab);
updateActiveTab();

/* ---- Rendu initial ---- */

renderHero();
renderToday();
renderWeekSessionsList();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
